# Reglas de negocio exclusivas de la plantilla CONSULTORIA.
#
# Reglas entre campos, consistencia entre registros
# y obligatoriedad condicional.

# ---------------------------------------------------------
# 1. Fecha final posterior a fecha inicial.
# ---------------------------------------------------------

FECHA_FINAL:
  kind: date_after_column
  after_column: FECHA_INICIO
  strict: true
  message: >
    La fecha final debe ser estrictamente posterior
    a la fecha de inicio.


# ---------------------------------------------------------
# 2. Consistencia entre registros de una consultoría.
# ---------------------------------------------------------

CODIGO_CONSULTORIA:
  kind: cross_row_consistency_note
  check_columns:
    - DESCRIPCION_CONSULTORIA
    - ID_CINE_CAMPO_DETALLADO
    - NOMBRE_ENTIDAD
    - ID_SECTOR_CONSULTORIA
    - VALOR
    - FECHA_INICIO
    - FECHA_FINAL
    - SEDE QUE GESTIONA LA CONSULTORÍA
  message: >
    Para un mismo CODIGO_CONSULTORIA no puede haber valores
    distintos de descripción, campo CINE, nombre de entidad,
    sector, valor, fechas o sede que gestiona la consultoría.


# ---------------------------------------------------------
# 3. Campos condicionalmente obligatorios.
# ---------------------------------------------------------

conditional_required_fields:

  CONSULTORIA:

    VLR_FINANCIACION_NACIONAL:
      when:
        column: ID_FUENTE_NACIONAL
        operator: not_blank

    VLR_FINANCIACION_INTERNACIONAL:
      when:
        column: ID_FUENTE_INTERNACIONAL
        operator: not_blank

    NOMBRE_INSTITUCION:
      when:
        any:
          - column: ID_FUENTE_INTERNACIONAL
            operator: not_blank
          - column: VLR_FINANCIACION_INTERNACIONAL
            operator: gt
            value: 0

    ID_PAIS_FINANCIADOR:
      when:
        any:
          - column: ID_FUENTE_INTERNACIONAL
            operator: not_blank
          - column: VLR_FINANCIACION_INTERNACIONAL
            operator: gt
            value: 0