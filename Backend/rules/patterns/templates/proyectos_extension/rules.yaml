
# Definición de campos de la plantilla PROYECTOS DE EXTENSIÓN.
# Fuente principal: Manual MEN, sección 11.7, páginas 170-177.
# Las restricciones individuales están en validations.yaml.
# Las reglas entre campos están en business_rules.yaml.

