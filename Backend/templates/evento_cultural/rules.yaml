# Definición de campos de la plantilla EVENTO CULTURAL.
#
# Este archivo contiene exclusivamente características de los campos:
# tipo de dato, obligatoriedad, longitud y descripción.
#
# Las restricciones ejecutables se encuentran en validations.yaml.
# La lógica de negocio se encuentra en business_rules.yaml.

sheets:

  EVENTO_CULTURAL:

    AÑO:
      datatype: integer
      required: true
      exact_length: 4
      description: "Año del reporte de información."

    SEMESTRE:
      datatype: integer
      required: true
      exact_length: 1
      allowed_values:
        - code: "1"
          label: "Periodo anual"
        - code: "2"
          label: "Periodo semestral"

    CODIGO_UNIDAD_ORGANIZACIONAL:
      datatype: alphanumeric
      required: true
      max_length: 30
      description: "Código de la unidad organizacional."

    CODIGO_EVENTO:
      datatype: alphanumeric
      required: true
      max_length: 15
      description: "Código de identificación del evento cultural."

    DESCRIPCION_EVENTO:
      datatype: alphanumeric
      required: true
      max_length: 200
      description: "Descripción del evento cultural."

    FECHA_INICIO:
      datatype: date
      required: true
      description: "Fecha de inicio del evento cultural."

    FECHA_FINAL:
      datatype: date
      required: false
      description: "Fecha final del evento cultural."

    ID_FUENTE_NACIONAL:
      datatype: integer
      required: false
      max_length: 2
      description: "Identificador de la fuente de financiación nacional."

    VLR_FINANCIACION_NACIONAL:
      datatype: decimal
      required: false
      max_length: 10
      description: "Valor de financiación nacional en pesos."

    NOMBRE_INSTITUCION:
      datatype: alphanumeric
      required: false
      max_length: 200
      description: "Nombre de la institución financiadora internacional."

    ID_PAIS_FINANCIADOR:
      datatype: integer
      required: false
      max_length: 3
      description: "Identificador del país financiador."

    ID_FUENTE_INTERNACIONAL:
      datatype: integer
      required: false
      max_length: 2
      description: "Identificador de la fuente de financiación internacional."

    VLR_FINANCIACION_INTERNACIONAL:
      datatype: decimal
      required: false
      max_length: 10
      description: "Valor de financiación internacional en pesos."


  EVENTO_CULT_REC_HUMANO:

    AÑO:
      datatype: integer
      required: true
      exact_length: 4

    SEMESTRE:
      datatype: integer
      required: true
      exact_length: 1
      allowed_values:
        - code: "1"
          label: "Periodo anual"
        - code: "2"
          label: "Periodo semestral"

    CODIGO_UNIDAD_ORGANIZACIONAL:
      datatype: alphanumeric
      required: true
      max_length: 30

    CODIGO_EVENTO:
      datatype: alphanumeric
      required: true
      max_length: 15

    ID_TIPO_DOCUMENTO:
      datatype: alphanumeric
      required: true
      exact_length: 2
      allowed_values: [CC, DE, CE, TI, PS, CA, PT]

    NUM_DOCUMENTO:
      datatype: alphanumeric
      required: true
      max_length: 30

    DEDICACION:
      datatype: decimal
      required: true
      max_length: 10


  EVENTO_CULT_BENEFICIARIOS:

    AÑO:
      datatype: integer
      required: true
      exact_length: 4

    SEMESTRE:
      datatype: integer
      required: true
      exact_length: 1
      allowed_values:
        - code: "1"
          label: "Periodo anual"
        - code: "2"
          label: "Periodo semestral"

    CODIGO_UNIDAD_ORGANIZACIONAL:
      datatype: alphanumeric
      required: true
      max_length: 30

    CODIGO_EVENTO:
      datatype: alphanumeric
      required: true
      max_length: 15

    ID_TIPO_BENEFICIARIO:
      datatype: integer
      required: true
      max_length: 2
      allowed_values: [1, 2, 3, 4, 5]

    TOTAL_ASISTENTES:
      datatype: integer
      required: true
      max_length: 10

    VALOR_ENTRADA:
      datatype: decimal
      required: true
      max_length: 10