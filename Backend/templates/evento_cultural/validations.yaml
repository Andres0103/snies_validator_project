# Validaciones específicas de la plantilla EVENTO CULTURAL.

sheets:

  EVENTO_CULTURAL:

    FECHA_INICIO:
      date_within_past_years: 80

    VLR_FINANCIACION_NACIONAL:
      min_value: 0

    ID_FUENTE_NACIONAL:
      catalog: fuente_nacional

    NOMBRE_INSTITUCION: {}

    ID_PAIS_FINANCIADOR:
      catalog: paises
      excluded_values:
        - '170'

    ID_FUENTE_INTERNACIONAL:
      catalog: fuente_internacional

    VLR_FINANCIACION_INTERNACIONAL:
      min_value: 0


  EVENTO_CULT_REC_HUMANO:

    DEDICACION:
      min_value: 0


  EVENTO_CULT_BENEFICIARIOS:

    TOTAL_ASISTENTES:
      min_value: 0

    VALOR_ENTRADA:
      min_value: 0