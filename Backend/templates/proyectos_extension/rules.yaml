
# Definición de campos de la plantilla PROYECTOS DE EXTENSIÓN.
# Fuente: Manual MEN 2025, sección 11.7, páginas 171-177.
# Las validaciones individuales se configuran en validations.yaml.
# Las reglas entre campos se configuran en business_rules.yaml.

sheets:

  PROYECTOS_EXTENSION:

    AÑO:
      datatype: integer
      required: true
      exact_length: 4

    SEMESTRE:
      datatype: integer
      required: true
      exact_length: 1
      allowed_values: [-1, -2]

    CODIGO_UNIDAD_ORGANIZACIONAL:
      datatype: alphanumeric
      required: true
      max_length: 30

    CODIGO_PROYECTO:
      datatype: alphanumeric
      required: true
      max_length: 15

    NOMBRE_PROYECTO:
      datatype: alphanumeric
      required: true
      max_length: 400

    DESCRIPCION_PROYECTO:
      datatype: alphanumeric
      required: true
      max_length: 250

    VALOR_PROYECTO:
      datatype: decimal
      required: true
      max_length: 15

    ID_AREA_EXTENSION:
      datatype: integer
      required: true
      max_length: 2
      allowed_values: [1, 2, 3, 4]

    FECHA_INICIO:
      datatype: date
      required: true

    FECHA_FINAL:
      datatype: date
      required: false

    NOMBRE_CONTACTO:
      datatype: alphanumeric
      required: true
      max_length: 50

    APELLIDO_CONTACTO:
      datatype: alphanumeric
      required: true
      max_length: 50

