
# Definición de campos de SERVICIOS DE EXTENSIÓN.
# Fuente: Manual MEN 2025, sección 11.6, páginas 163-170.
#
# Las restricciones de formato, fechas, valores mínimos y catálogos
# se complementan en validations.yaml.
#
# Las reglas de negocio que involucren relaciones entre hojas
# se configuran en business_rules.yaml.

sheets:

  SERVICIOS_EXTENSION:
    AÑO:
      datatype: integer
      required: true
      exact_length: 4

    SEMESTRE:
      datatype: integer
      required: true
      exact_length: 1
      allowed_values: [1, 2]

    CODIGO_UNIDAD_ORGANIZACIONAL:
      datatype: alphanumeric
      required: true
      max_length: 30

    CODIGO_SERVICIO:
      datatype: alphanumeric
      required: true
      max_length: 15

    NOMBRE_SERVICIO:
      datatype: alphanumeric
      required: true
      max_length: 400

    DESCRIPCION_SERVICIO:
      datatype: alphanumeric
      required: true
      max_length: 250

    VALOR_SERVICIO:
      datatype: decimal
      required: true
      max_length: 15

    ID_AREA_EXTENSION:
      datatype: integer
      required: true
      max_length: 2
      allowed_values: [1, 2, 3, 4]

    FECHA_INICIO:
      datatype: date
      required: true

    FECHA_FINAL:
      datatype: date
      required: false

    NOMBRE_CONTACTO:
      datatype: alphanumeric
      required: true
      max_length: 50

    APELLIDO_CONTACTO:
      datatype: alphanumeric
      required: true
      max_length: 50

    TELEFONO_CONTACTO:
      datatype: alphanumeric
      required: true
      max_length: 15

    EMAIL_CONTACTO:
      datatype: alphanumeric
      required: true
      max_length: 50

    TIENE_COSTO:
      datatype: alphabetic
      required: true
      exact_length: 1
      allowed_values: [S, N]

    CRITERIO_ELEGIBILIDAD:
      datatype: alphanumeric
      required: true
      max_length: 200

