
# Validaciones específicas de SERVICIOS DE EXTENSIÓN.
# Fuente principal: Manual MEN 2025, sección 11.6, páginas 163-170.
# Los tipos de datos, longitudes y obligatoriedad están definidos
# en rules.yaml.
# Los valores enumerados están definidos en rules.yaml.
# Los catálogos externos se consultan mediante catalogs.yaml.

sheets:

  SERVICIOS_EXTENSION:

    VALOR_SERVICIO:
      min_value: 0

    FECHA_INICIO:
      format:
        - "%d/%m/%Y"
        - "%d-%m-%Y"
      date_within_past_years: 80

    FECHA_FINAL:
      format:
        - "%d/%m/%Y"
        - "%d-%m-%Y"

    TELEFONO_CONTACTO:
      pattern: "^.{7,15}$"

    EMAIL_CONTACTO:
      pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"

  SERV_EXT_FUENTE_NACIONAL:

    ID_FUENTE_NACIONAL:
      catalog: fuente_nacional

    VALOR_FINANCIACION:
      min_value: 0

  SERV_EXT_FUENTE_INTERNACIONAL:

    ID_PAIS_FINANCIADOR:
      catalog: paises

    ID_FUENTE_INTERNACIONAL:
      catalog: fuente_internacional

    VALOR_FINANCIACION:
      min_value: 0

  SERV_EXT_OTRAS_ENTIDADES:

    ID_PAIS_ENTIDAD:
      catalog: paises

  SERV_EXT_POBL_CONDICION:

    CANTIDAD:
      min_value: 0

  SERV_EXT_POBL_GRUPO:

    CANTIDAD:
      min_value: 0
