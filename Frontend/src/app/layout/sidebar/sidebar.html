
<aside class="sidebar">

  <!-- IDENTIDAD DE NEBULA -->
  <div class="sidebar-brand">

    <div class="brand-icon">
      <span>N</span>
    </div>

    <div class="brand-info">
      <h2>NEBULA</h2>
      <span>Universidad de Antioquia</span>
    </div>

  </div>

  <!-- NAVEGACIÓN -->
  <div class="sidebar-section">

    <span class="section-title">MENÚ PRINCIPAL</span>

    <nav class="navigation" aria-label="Navegación principal">

      <a
        class="nav-item"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        title="Inicio"
      >
        <i class="bi bi-grid-1x2"></i>
        <span>Inicio</span>
      </a>

      <a
        class="nav-item"
        routerLink="/validation"
        routerLinkActive="active"
        title="Validación"
      >
        <i class="bi bi-file-earmark-check"></i>
        <span>Validación</span>
      </a>

      <a
        class="nav-item"
        routerLink="/history"
        routerLinkActive="active"
        title="Historial"
      >
        <i class="bi bi-clock-history"></i>
        <span>Historial</span>
      </a>

      <a
        class="nav-item"
        routerLink="/issues"
        routerLinkActive="active"
        title="Consulta de incidencias"
      >
        <i class="bi bi-exclamation-diamond"></i>
        <span>Consulta de incidencias</span>
      </a>

    </nav>

  </div>

  <!-- PIE DEL MENÚ -->
  <div class="sidebar-footer">

    <div class="footer-indicator"></div>

    <div class="footer-info">
      <span class="footer-title">Plataforma NEBULA</span>
      <span class="footer-subtitle">Universidad de Antioquia</span>
    </div>

  </div>

</aside>
