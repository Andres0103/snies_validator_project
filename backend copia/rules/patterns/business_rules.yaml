# Reglas de negocio que el Manual de Validaciones por Plantilla v8.12 del
# MEN documenta en su columna "VALIDACIONES", pero que NO están escritas
# en los comentarios de las celdas de las plantillas .xlsx. Se aplican por
# nombre de columna (los mismos nombres se repiten idénticos en varias
# plantillas de extensión/cultura), así que un solo catálogo cubre las 5
# plantillas sin duplicar reglas por archivo.
#
# `kind` le dice al constructor de validaciones de Excel qué tipo de
# fórmula nativa generar. Agregar una regla nueva = agregar una entrada
# aquí + (si el `kind` es nuevo) un manejador en
# validation/excel_validation_builder.py.
#
# Fuente: Manual_MEN_Validaciones_por_plantilla_8_12_diciembre_2025.pdf,
# sección 11 (EXTENSIÓN), páginas 141-181.

FECHA_INICIO:
  kind: date_within_past_years
  years: 80
  message: "La fecha debe estar entre hace 80 años y la fecha actual."

FECHA_FINAL:
  kind: date_after_column
  after_column: FECHA_INICIO
  strict: true
  message: "La fecha final debe ser igual o posterior a la fecha de inicio."

DEDICACION:
  kind: non_negative
  message: "La dedicación no puede ser negativa."

TELEFONO_CONTACTO:
  kind: non_negative_with_min_length
  min_length: 7
  message: "El teléfono no puede ser negativo y debe tener mínimo 7 dígitos."

EMAIL_CONTACTO:
  kind: email_format
  message: "El email debe estar bien estructurado (debe contener @)."

# Documentadas en el manual pero NO enforceables con validación nativa de
# Excel por celda, porque comparan valores entre FILAS distintas (incluso
# entre hojas). Se anotan aquí para que el sistema las muestre como
# advertencia en el encabezado y las deje registradas para el validador
# post-hoc (que sí puede recorrer todas las filas). No generan
# DataValidation.
#
# `check_columns`: SOLO estas columnas se comparan entre filas del mismo
# grupo (nunca "todas las columnas de la hoja" — eso produce falsos
# positivos masivos en hojas de detalle/hijas donde es NORMAL que varias
# filas compartan el mismo código, ej. varias personas bajo el mismo
# CODIGO_CONSULTORIA en la hoja de recurso humano).
# `group_by`: columna adicional que junto con la columna principal forma
# la llave de agrupación (algunas plantillas agrupan por
# codigo_X + codigo_unidad_organizacional, no solo por codigo_X).
#
# Fuente: Manual_MEN_Validaciones_por_plantilla_8_12_diciembre_2025.pdf,
# sección 11 (EXTENSIÓN), páginas 146-172. Solo se incluyen las columnas
# donde el manual documenta explícitamente esta regla; no se asume que
# aplique a otras columnas "CODIGO_*" sin confirmarlo primero contra el
# manual.
CODIGO_CONSULTORIA:
  kind: cross_row_consistency_note
  check_columns:
    - DESCRIPCION_CONSULTORIA
    - ID_CINE_CAMPO_DETALLADO
    - NOMBRE_ENTIDAD
    - ID_SECTOR_CONSULTORIA
    - VALOR
    - FECHA_INICIO
    - FECHA_FINAL
  message: >
    Para un mismo CODIGO_CONSULTORIA no puede haber valores distintos de
    descripción, entidad CINE, nombre de entidad, sector, valor o fechas.

CODIGO_EVENTO:
  kind: cross_row_consistency_note
  group_by: CODIGO_UNIDAD_ORGANIZACIONAL
  check_columns:
    - DESCRIPCION_EVENTO
    - FECHA_INICIO
    - FECHA_FINAL
  message: >
    Para un mismo CODIGO_EVENTO + CODIGO_UNIDAD_ORGANIZACIONAL no puede
    haber valores distintos de descripción o fechas.

CODIGO_ACTIVIDAD:
  kind: cross_row_consistency_note
  group_by: CODIGO_UNIDAD_ORGANIZACIONAL
  check_columns:
    - DESCRIPCION_ACTIVIDAD
    - ID_TIPO_ACTIVIDAD_CULTURAL
    - FECHA_INICIO
    - FECHA_FINAL
  message: >
    Para un mismo CODIGO_ACTIVIDAD + CODIGO_UNIDAD_ORGANIZACIONAL no
    puede haber valores distintos de descripción, tipo o fechas.

# NOTA: CODIGO_SERVICIO y CODIGO_PROYECTO NO tienen esta regla documentada
# en el manual (a diferencia de Consultoría/Actividad/Evento) — en esas
# plantillas cada fila de la hoja principal ya representa un
# servicio/proyecto individual, y las hojas hijas (ej.
# PROY_EXT_AREA_TRABAJO) repiten el código legítimamente una vez por
# área/ciclo vital asociado. Por eso NO se agregan aquí: agregarlos sin
# confirmación en el manual generaría falsos positivos como el que se
# corrigió en CODIGO_CONSULTORIA vs. la hoja de recurso humano.

# --- Reglas específicas de UNA sola hoja (no por nombre de columna en
# todo el workbook) ---
#
# A diferencia de las reglas anteriores (que aplican dondequiera que
# aparezca esa columna), estas solo aplican en la combinación exacta
# hoja+columna indicada. Es el mecanismo correcto para reglas como
# "CODIGO_SERVICIO no se debe repetir en SERV_EXT_ENTIDAD_NACIONAL":
# CODIGO_SERVICIO también existe en otras hojas donde SÍ es normal que se
# repita (ej. la hoja principal puede tener varias filas de un mismo
# servicio por otras razones), así que atarlo solo al nombre de columna
# no sería seguro — por eso se ata a hoja+columna.
sheet_scoped_rules:
  SERV_EXT_ENTIDAD_NACIONAL:
    CODIGO_SERVICIO:
      kind: unique_in_sheet
      severity: warning
      message: >
        CODIGO_SERVICIO repetido en SERV_EXT_ENTIDAD_NACIONAL. Verifique
        que cada fila corresponda a una asociación distinta con una
        entidad nacional (si el mismo servicio tiene más de una entidad
        nacional asociada, cada fila debe tener una entidad DISTINTA; si
        el código se repitió con la misma entidad, es un duplicado real).
# Campos condicionalmente obligatorios en la plantilla CONSULTORIA.
# Las condiciones se evalúan usando los valores de la misma fila.

conditional_required_fields:
  CONSULTORIA:

    VLR_FINANCIACION_NACIONAL:
      when:
        column: ID_FUENTE_NACIONAL
        operator: not_blank

    VLR_FINANCIACION_INTERNACIONAL:
      when:
        column: ID_FUENTE_INTERNACIONAL
        operator: not_blank

    NOMBRE_INSTITUCION:
      when:
        any:
          - column: ID_FUENTE_INTERNACIONAL
            operator: not_blank
          - column: VLR_FINANCIACION_INTERNACIONAL
            operator: gt
            value: 0

    ID_PAIS_FINANCIADOR:
      when:
        any:
          - column: ID_FUENTE_INTERNACIONAL
            operator: not_blank
          - column: VLR_FINANCIACION_INTERNACIONAL
            operator: gt
            value: 0