# Configuración de reglas de validación para reportes de consultoría

validation_config:
  # Configuración de archivos maestros
  master_tables:
    paises:
      file: "insumos/Tabla paises SNIES.xlsx"
      key_column: "ID_PAIS"
      description_column: "DESC_PAIS"

    departamentos:
      file: "insumos/Listado_departamentos_municipios.xlsx"
      key_column: "ID_DEPARTAMENTO"
      description_column: "DESC_DEPARTAMENTO"

    cine_campos:
      file: "insumos/Cine_Campo_Detallado.xlsx"
      key_column: "ID_CINE_CAMPO_DETALLADO"
      description_column: "DESC_CINE_CAMPO_DETALLADO"

    fuente_internacional:
      file: "insumos/tablas-unicas-consultoria/Tabla fuente internacional.xlsx"
      key_column: "ID_FUENTE_INTERNACIONAL"
      description_column: "DESCRIPCIÓN"

    fuente_nacional:
      file: "insumos/tablas-unicas-consultoria/Tabla fuente nacional.xlsx"
      key_column: "ID_FUENTE_NACIONAL"
      description_column: "DESCRIPCIÓN"

    sector_consultoria:
      file: "insumos/tablas-unicas-consultoria/Tabla sector consultoria.xlsx"
      key_column: "ID_SECTOR_CONSULTORIA"
      description_column: "DESCRIPCIÓN"

    sede:
      file: "insumos/tablas-unicas-consultoria/Tabla sede.xlsx"
      key_column: "ID_IES_UDEA"
      description_column: "Descripción"

  # Reglas de validación por columna
  column_rules:
    # Validaciones de formato y tipo

    SEDE QUE GESTIONA LA CONSULTORÍA:
      type: "integer"
      required: true
      master_table: "sede"
      description: "ID de sede debe existir en la tabla de sedes"
    AÑO:
      type: "integer"
      required: true
      min_value: 2020
      max_value: 2080
      description: "Año debe ser un entero entre 2020 y 2080"

    SEMESTRE:
      type: "integer"
      required: true
      allowed_values: [1, 2]
      description: "Semestre debe ser 1 o 2"

    CODIGO_CONSULTORIA:
      type: "string"
      required: true
      min_length: 30
      max_length: 30
      pattern: "^[A-Z0-9-]+$"
      description: "Código de consultoría debe ser alfanumérico (mayúsculas, números y guiones)"

    DESCRIPCION_CONSULTORIA:
      type: "string"
      required: true
      min_length: 10
      max_length: 400
      description: "Descripción debe tener entre 10 y 500 caracteres"

    # Validaciones de tabla maestra
    ID_CINE_CAMPO_DETALLADO:
      type: "integer"
      required: true
      master_table: "cine_campos"
      description: "ID debe existir en la tabla de campos CINE detallados"

    NOMBRE_ENTIDAD:
      type: "string"
      required: true
      min_length: 3
      max_length: 200
      description: "Nombre de entidad debe tener entre 3 y 200 caracteres"

    ID_SECTOR_CONSULTORIA:
      type: "integer"
      required: true
      master_table: "sector_consultoria"
      description: "ID de sector de consultoría debe existir en la tabla de sectores de consultoría"

    VALOR:
      type: "numeric"
      required: true
      min_value: 0
      description: "Valor debe ser un número positivo"

    FECHA_INICIO:
      type: "date"
      required: true
      format: "%d-%m-%Y"
      description: "Fecha de inicio debe ser una fecha válida en formato DD-MM-YYYY"

    FECHA_FINAL:
      type: "date"
      required: true
      format: "%d-%m-%Y"
      description: "Fecha final debe ser una fecha válida en formato DD-MM-YYYY"

    ID_FUENTE_NACIONAL:
      type: "integer"
      required: true
      master_table: "fuente_nacional"
      description: "ID de fuente nacional debe existir en la tabla de fuentes nacionales"

    VLR_FINANCIACION_NACIONAL:
      type: "numeric"
      required: true
      min_value: 0
      description: "Valor de financiación nacional debe ser positivo si se especifica"

    VLR_FINANCIACION_INTERNACIONAL:
      type: "numeric"
      required: true
      min_value: 0
      description: "Valor de financiación internacional debe ser positivo si se especifica"

    NOMBRE_INSTITUCION:
      type: "string"
      required: false
      min_length: 3
      max_length: 200
      description: "Nombre de institución debe tener entre 3 y 200 caracteres cuando hay financiación internacional"

    ID_PAIS_FINANCIADOR:
      type: "integer"
      required: true
      master_table: "paises"
      description: "ID de país debe existir en la tabla de países SNIES si se especifica"

    ID_FUENTE_INTERNACIONAL:
      type: "integer"
      required: true
      master_table: "fuente_internacional"
      description: "ID de fuente internacional debe existir en la tabla de fuentes internacionales"

    VLR_FINANCIACION_INTERNACIONAL:
      type: "integer"
      required: true
      description: "Valor de financiación internacional debe ser positivo si se especifica"

  # Reglas de lógica de negocio
  business_rules:
    - name: "valor_suma_financiaciones"
      description: "El VALOR debe ser igual a la suma de VLR_FINANCIACION_NACIONAL + VLR_FINANCIACION_INTERNACIONAL"
      type: "calculation"
      formula: "VALOR == (VLR_FINANCIACION_NACIONAL or 0) + (VLR_FINANCIACION_INTERNACIONAL or 0)"

    - name: "financiacion_internacional_completa"
      description: "Si hay financiación internacional, todos los campos relacionados deben estar completos"
      type: "conditional"
      condition: "VLR_FINANCIACION_INTERNACIONAL > 0"
      required_fields:
        ["NOMBRE_INSTITUCION", "ID_PAIS_FINANCIADOR", "ID_FUENTE_INTERNACIONAL"]

    - name: "fechas_coherentes"
      description: "La fecha de inicio debe ser anterior a la fecha final"
      type: "comparison"
      rule: "FECHA_INICIO < FECHA_FINAL"

    - name: "sede_unica"
      description: "Solo se permite una sede por consultoría"
      type: "uniqueness"
      field: "SEDE QUE GESTIONA LA CONSULTORÍA"
      scope: "CODIGO_CONSULTORIA"

    - name: "pais_financiador_organismo_multilateral"
      description: "Si la fuente internacional es 'Organismo Multilateral', el país financiador debe ser 0 (No aplica)."
      type: "cross_reference"
      source_table: "fuente_internacional"
      source_column: "ID_FUENTE_INTERNACIONAL"
      source_description_column: "DESCRIPCIÓN"
      condition_description: "Organismo Multilateral"
      target_column: "ID_PAIS_FINANCIADOR"
      expected_target_value: 0

    # Configuración de reportes
  reporting:
    severity_levels:
      ERROR: "Errores críticos que impiden el procesamiento"
      WARNING: "Advertencias que requieren revisión"
      INFO: "Información adicional para verificación"

    output_formats: ["excel", "json", "html"]

    include_statistics: true
    include_recommendations: true

    # Solo reportar errores y advertencias, no códigos válidos (para evitar ruido)
    show_valid_codes: false

    # Mostrar solo errores críticos en consola (WARNING e INFO solo en archivos)
    console_errors_only: false
